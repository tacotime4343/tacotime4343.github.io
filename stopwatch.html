<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
  <head>

    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
      initial-scale=1.0">
    <title>Stopwatch and Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            gap: 80px; /* Increased space between stopwatch and calculator */
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- Stopwatch Styles --- */
        .stopwatch-container {
            text-align: center;
            width: 100%; 
            max-width: 600px; 
        }

        .display-container {
            background-color: #e0e8f8; 
            border: 3px solid #333; 
            border-radius: 20px;
            padding: 30px 40px;
            margin-bottom: 25px;
            position: relative; 
        }

        .time-main {
            font-size: 8rem; 
            font-weight: bold;
            display: block; 
            letter-spacing: -2px; 
            line-height: 1; 
            text-align: center;
        }

        .ms-small {
            font-size: 1.5rem; 
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #555; 
        }

        .button-container {
            display: flex;
            justify-content: space-between; 
            width: 100%;
        }

        .btn {
            font-size: 2rem;
            padding: 15px 0; 
            border-radius: 12px;
            cursor: pointer;
            border: 3px solid #333; 
            width: 45%; 
            color: black;
            font-weight: bold;
            transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98); 
        }

        .start-btn { background-color: #00e000; }
        .start-btn:hover { background-color: #00ca00; }
        .start-btn.running { background-color: #eab308; }
        .clear-btn { background-color: #e00000; }
        .clear-btn:hover { background-color: #c70000; }

        /* --- Calculator Styles --- */
        .calculator-container {
            background-color: #e0e8f8;
            border: 3px solid #333;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 400px; 
            box-sizing: border-box;
        }

        .calc-display {
            width: 100%;
            box-sizing: border-box;
            font-size: 3rem;
            padding: 15px;
            margin-bottom: 20px;
            text-align: right;
            border: 3px solid #333;
            border-radius: 12px;
            font-family: monospace;
            background-color: white;
            color: black;
        }

        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-btn {
            font-size: 1.8rem;
            padding: 20px 0;
            border-radius: 12px;
            cursor: pointer;
            border: 3px solid #333;
            background-color: #fff;
            color: black;
            font-weight: bold;
            transition: transform 0.1s, background-color 0.2s;
        }

        .calc-btn:active {
            transform: scale(0.95);
        }

        .calc-btn:hover { background-color: #f0f0f0; }
        .calc-btn.op { background-color: #eab308; }
        .calc-btn.op:hover { background-color: #dca300; }
        .calc-btn.clear { background-color: #e00000; }
        .calc-btn.clear:hover { background-color: #c70000; }
        .calc-btn.equal { background-color: #00e000; grid-column: span 2; }
        .calc-btn.equal:hover { background-color: #00ca00; }

    </style>
  </head>
  <body>
    <div class="stopwatch-container">
      <div class="display-container"> <span class="time-main"
          id="display">00:00:00</span> <span class="ms-small" id="ms">000</span>
      </div>
      <div class="button-container"> <button class="btn start-btn"
          id="startStopBtn" onclick="startStop()">Start</button> <button
          class="btn clear-btn" id="clearBtn" onclick="clearTimer()">Clear</button>
      </div>
    </div>
    <div class="calculator-container"> <input id="calcDisplay"
        class="calc-display" disabled="disabled" type="text">
      <div class="calc-buttons"> <button class="calc-btn clear"
          onclick="clearCalc()" style="grid-column: span 2;">C</button>
        <button class="calc-btn op" onclick="appendCalc('/')">/</button>
        <button class="calc-btn op" onclick="appendCalc('*')">*</button>
        <button class="calc-btn" onclick="appendCalc('7')">7</button> <button
          class="calc-btn" onclick="appendCalc('8')">8</button> <button
          class="calc-btn" onclick="appendCalc('9')">9</button> <button
          class="calc-btn op" onclick="appendCalc('-')">-</button> <button
          class="calc-btn" onclick="appendCalc('4')">4</button> <button
          class="calc-btn" onclick="appendCalc('5')">5</button> <button
          class="calc-btn" onclick="appendCalc('6')">6</button> <button
          class="calc-btn op" onclick="appendCalc('+')">+</button> <button
          class="calc-btn" onclick="appendCalc('1')">1</button> <button
          class="calc-btn" onclick="appendCalc('2')">2</button> <button
          class="calc-btn" onclick="appendCalc('3')">3</button> <button
          class="calc-btn equal" onclick="calculate()" style="grid-row:
          span 2; grid-column: span 1; height: 100%;">=</button> <button
          class="calc-btn" onclick="appendCalc('0')" style="grid-column:
          span 2;">0</button> <button class="calc-btn"
          onclick="appendCalc('.')">.</button> </div>
    </div>
    <script>
        // --- Stopwatch Logic ---
        let startTime;
        let elapsedTime = 0;
        let timerInterval;
        let running = false;

        const displayEl = document.getElementById("display");
        const msEl = document.getElementById("ms");
        const startStopBtnEl = document.getElementById("startStopBtn");

        function updateDisplay() {
            let elapsed = Date.now() - startTime;
            
            let ms = elapsed % 1000;
            let seconds = Math.floor(elapsed / 1000) % 60;
            let minutes = Math.floor(elapsed / (1000 * 60)) % 60;
            let hours = Math.floor(elapsed / (1000 * 60 * 60));

            ms = String(ms).padStart(3, '0');
            seconds = String(seconds).padStart(2, '0');
            minutes = String(minutes).padStart(2, '0');
            hours = String(hours).padStart(2, '0');

            displayEl.innerHTML = `${hours}:${minutes}:${seconds}`;
            msEl.innerHTML = ms;
        }

        function startStop() {
            if (!running) {
                startTime = Date.now() - elapsedTime; 
                timerInterval = setInterval(updateDisplay, 10); 
                startStopBtnEl.innerHTML = "Stop";
                startStopBtnEl.classList.add("running");
                running = true;
            } else {
                clearInterval(timerInterval);
                elapsedTime = Date.now() - startTime; 
                startStopBtnEl.innerHTML = "Start";
                startStopBtnEl.classList.remove("running");
                running = false;
            }
        }

        function clearTimer() {
            clearInterval(timerInterval);
            running = false;
            elapsedTime = 0;
            startStopBtnEl.innerHTML = "Start";
            startStopBtnEl.classList.remove("running");
            displayEl.innerHTML = "00:00:00";
            msEl.innerHTML = "000";
        }

        // --- Calculator Logic ---
        const calcDisplayEl = document.getElementById("calcDisplay");

        function appendCalc(value) {
            const lastChar = calcDisplayEl.value.slice(-1);
            const operators = ['+', '-', '*', '/'];
            
            if (operators.includes(value) && operators.includes(lastChar)) {
                return;
            }
            
            calcDisplayEl.value += value;
        }

        function clearCalc() {
            calcDisplayEl.value = "";
        }

        function calculate() {
            try {
                if(calcDisplayEl.value !== "") {
                    const result = new Function('return ' + calcDisplayEl.value)();
                    calcDisplayEl.value = Number.isInteger(result) ? result : parseFloat(result.toFixed(5));
                }
            } catch (error) {
                calcDisplayEl.value = "Error";
                setTimeout(clearCalc, 1500); 
            }
        }
    </script>
  </body>
</html>
