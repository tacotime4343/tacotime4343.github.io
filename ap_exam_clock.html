
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Euro Exam Countdown</title>
    <style>
        /* Import an elegant font from Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            /* Majestic library background fitting for AP Euro */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Glassmorphism card effect */
        .countdown-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 50px 60px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            max-width: 900px;
            width: 90%;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            margin-top: 0;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-transform: uppercase;
            color: #e0e0e0;
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 25px;
            min-width: 120px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .time-box span {
            display: block;
            font-size: 4.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #b3b3b3;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 800px) {
            h1 { font-size: 2.5rem; }
            h2 { font-size: 1rem; }
            .time-box { min-width: 80px; padding: 15px; }
            .time-box span { font-size: 2.5rem; }
            .timer { gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="countdown-container">
        <h1>AP European History Exam</h1>
        <h2>Monday, May 4th @ 12:00 PM</h2>
        
        <div class="timer" id="timer">
            <div class="time-box">
                <span id="days">00</span>
                <div class="label">Days</div>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <div class="label">Hours</div>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <div class="label">Minutes</div>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <div class="label">Seconds</div>
            </div>
        </div>
    </div>

    <script>
        // Set the exact date and time we're counting down to
        const countDownDate = new Date("May 4, 2026 12:00:00").getTime();

        // Update the countdown every 1 second
        const x = setInterval(function() {

            const now = new Date().getTime();
            const distance = countDownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerHTML = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerHTML = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerHTML = seconds < 10 ? "0" + seconds : seconds;

            // When the countdown hits zero, display a good luck message
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("timer").innerHTML = "<h2>Pencils ready! Good luck on the exam!</h2>";
            }
        }, 1000);
    </script>

</body>
</html>
